<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>HASC RM Compliance — Sign In</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,sans-serif;background:#f0f2f5;color:#323130;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:14px;box-shadow:0 4px 16px rgba(0,0,0,.1);width:100%;max-width:420px;overflow:hidden;border-top:4px solid #00a884}
.card-body{padding:34px 32px}
.brand{text-align:center;margin-bottom:6px;font-size:22px;font-weight:700}
.brand .t{color:#008272}.brand .y{color:#F5C518}
.sub{text-align:center;color:#008272;font-weight:700;font-size:16px;margin-bottom:2px}
.hint{text-align:center;color:#605e5c;font-size:13px;margin-bottom:22px}
label{display:block;font-size:12px;font-weight:600;color:#323130;margin-bottom:6px;margin-top:14px}
input{width:100%;padding:11px 13px;border:1px solid #e1e1e1;border-radius:8px;font-size:14px;font-family:inherit;background:#f8f9fb}
input:focus{outline:none;border-color:#008272;box-shadow:0 0 0 2px rgba(0,130,114,.12)}
.btn{width:100%;margin-top:22px;padding:13px;border:none;border-radius:8px;background:#00a884;color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.btn:hover{background:#008272}.btn:disabled{background:#a19f9d;cursor:not-allowed}
.msg{margin-top:14px;font-size:13px;text-align:center;min-height:18px;color:#d13438}
.foot{text-align:center;color:#a19f9d;font-size:11px;margin-top:18px;line-height:1.5}
</style>
</head>
<body>
<div class="card"><div class="card-body">
<div class="brand"><span class="t">HASC</span> <span class="y">CENTER</span></div>
<div class="sub">RM Compliance</div>
<div class="hint">Sign in to continue</div>
<form id="loginForm">
<label for="email">Email</label>
<input id="email" type="email" autocomplete="username" required/>
<label for="password">Password</label>
<input id="password" type="password" autocomplete="current-password" required/>
<button class="btn" id="btn" type="submit">Sign In</button>
<div class="msg" id="msg"></div>
</form>
<div class="foot">Secure sign-in. Your password is checked by the server, never stored in this page.</div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="wb-config.js"></script>
<script>
var c = window.HASC_CONFIG || {};
var sb = window.supabase.createClient(c.SUPABASE_URL, c.SUPABASE_ANON_KEY);
function routeFor(role){ return (role==="residence_manager") ? "wb-checkoff.html" : "wb-today.html"; }
(async function(){
  try{
    var s = await sb.auth.getSession();
    if(s && s.data && s.data.session){
      var uid = s.data.session.user.id;
      var p = await sb.from("profiles").select("role,residences").eq("id",uid).single();
      if(p && p.data){
        try{ sessionStorage.setItem("hasc_role", p.data.role||""); sessionStorage.setItem("hasc_homes", JSON.stringify(p.data.residences||[])); }catch(e){}
        location.replace(routeFor(p.data.role));
      }
    }
  }catch(e){}
})();
document.getElementById("loginForm").addEventListener("submit", async function(ev){
  ev.preventDefault();
  var btn = document.getElementById("btn");
  var msg = document.getElementById("msg");
  msg.style.color = "#d13438"; msg.textContent = "";
  btn.disabled = true; btn.textContent = "Signing in…";
  var email = document.getElementById("email").value.trim();
  var password = document.getElementById("password").value;
  try{
    var r = await sb.auth.signInWithPassword({ email: email, password: password });
    if(r.error){ throw r.error; }
    var uid = r.data.user.id;
    var p = await sb.from("profiles").select("role,residences").eq("id",uid).single();
    if(p.error || !p.data){ throw new Error("No profile / role found for this account."); }
    try{ sessionStorage.setItem("hasc_role", p.data.role||""); sessionStorage.setItem("hasc_homes", JSON.stringify(p.data.residences||[])); }catch(e){}
    location.replace(routeFor(p.data.role));
  }catch(err){
    msg.textContent = (err && err.message) ? err.message : "Sign in failed.";
    btn.disabled = false; btn.textContent = "Sign In";
  }
});
</script>
</body>
</html>
