<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>HASC RM Compliance — Sign In</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#f4f6f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#1a1a2e;}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.card{background:#fff;border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.1);padding:34px 30px;width:100%;max-width:360px;border-top:4px solid #3FC1C9;}
.logo{display:flex;justify-content:center;margin-bottom:18px;}
.logo img{height:42px;width:auto;display:block;}
h1{font-size:18px;font-weight:800;text-align:center;margin:0 0 4px;color:#1a8c94;}
.sub{font-size:12px;color:#8a9ab0;text-align:center;margin:0 0 22px;}
label{display:block;font-size:12px;font-weight:600;color:#5a6a7e;margin:0 0 5px;}
input{width:100%;padding:10px 12px;border:1.5px solid #dce3ea;border-radius:9px;font-size:14px;outline:none;background:#f8fafc;margin-bottom:14px;box-sizing:border-box;}
input:focus{border-color:#3FC1C9;background:#fff;}
button{width:100%;padding:11px;border:none;border-radius:9px;background:#3FC1C9;color:#fff;font-size:14px;font-weight:700;cursor:pointer;}
button:disabled{opacity:.6;cursor:default;}
.msg{font-size:12.5px;margin:4px 0 12px;min-height:16px;text-align:center;}
.msg.err{color:#c62828;}
.msg.ok{color:#1a8c94;}
.note{font-size:11px;color:#a8b3c0;text-align:center;margin-top:16px;line-height:1.5;}

.logo-svg{display:block;margin:0 auto 14px;max-width:170px;height:auto}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<div class="logo-svg"><svg class="header-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 60">
<rect x="0" y="2" width="22" height="22" fill="#008272"/>
<polygon points="26,24 48,24 37,2" fill="#F5C518"/>
<circle cx="11" cy="39" r="11" fill="#F5C518"/>
<rect x="37" y="28" width="11" height="22" fill="#008272"/>
<text x="56" y="26" font-family="Segoe UI,Arial,sans-serif" font-weight="700" font-size="22" fill="#008272" letter-spacing="1">HASC</text>
<text x="56" y="50" font-family="Segoe UI,Arial,sans-serif" font-weight="700" font-size="22" fill="#008272" letter-spacing="1">CENTER</text>
</svg></div>
<h1>HASC RM Compliance</h1>
<div class="sub">Sign in to access the compliance portal</div>
<form id="loginForm">
<label for="email">Email</label>
<input id="email" type="email" autocomplete="username" required/>
<label for="password">Password</label>
<input id="password" type="password" autocomplete="current-password" required/>
<button id="btn" type="submit">Sign In</button>
<div class="msg" id="msg"></div>
</form>
<div class="note">Secure sign-in. Your password is checked by the server, never stored in this page.</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="wb-config.js"></script>
<script>
var c = window.HASC_CONFIG || {};
var sb = window.supabase.createClient(c.SUPABASE_URL, c.SUPABASE_ANON_KEY);
function routeFor(role){ return (role==="residence_manager") ? "wb-checkoff.html" : "wb-today.html"; }
(async function(){
  try{
    var s = await sb.auth.getSession();
    if(s && s.data && s.data.session){
      var uid = s.data.session.user.id;
      var p = await sb.from("profiles").select("role,residences").eq("id",uid).single();
      if(p && p.data){
        try{ sessionStorage.setItem("hasc_role", p.data.role||""); sessionStorage.setItem("hasc_homes", JSON.stringify(p.data.residences||[])); }catch(e){}
        location.replace(routeFor(p.data.role));
      }
    }
  }catch(e){}
})();
document.getElementById("loginForm").addEventListener("submit", async function(ev){
  ev.preventDefault();
  var btn = document.getElementById("btn");
  var msg = document.getElementById("msg");
  msg.className = "msg err"; msg.textContent = "";
  btn.disabled = true; btn.textContent = "Signing in…";
  var email = document.getElementById("email").value.trim();
  var password = document.getElementById("password").value;
  try{
    var r = await sb.auth.signInWithPassword({ email: email, password: password });
    if(r.error){ throw r.error; }
    var uid = r.data.user.id;
    var p = await sb.from("profiles").select("role,residences").eq("id",uid).single();
    if(p.error || !p.data){ throw new Error("No profile / role found for this account."); }
    try{ sessionStorage.setItem("hasc_role", p.data.role||""); sessionStorage.setItem("hasc_homes", JSON.stringify(p.data.residences||[])); }catch(e){}
    location.replace(routeFor(p.data.role));
  }catch(err){
    msg.className = "msg err"; msg.textContent = (err && err.message) ? err.message : "Sign in failed.";
    btn.disabled = false; btn.textContent = "Sign In";
  }
});
</script>
</body>
</html>
