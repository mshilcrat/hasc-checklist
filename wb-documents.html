<head>

<title>HASC RM Compliance — Documents</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="wb-config.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;background:#f6f7f5;color:#26302e;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
:root{--teal:#008272;--teal-dark:#006458;--yellow:#F5C518;--green:#1D9E75;--red:#E24B4A;--amber:#BA7517;--bg:#f6f7f5;--card:#fff;--ink:#26302e;--ink-2:#5d6b67;--ink-3:#9aa4a0;--line:#e7eae8;--line-soft:#f0f2f0;--shadow:0 1px 3px rgba(0,0,0,.05),0 1px 2px rgba(0,0,0,.04)}
header{background:#fff;border-bottom:3px solid var(--yellow);padding:12px 22px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.brand{display:flex;align-items:center;gap:12px}
.brand img{height:34px;display:block}
.who{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--ink-2)}
.who .av{width:28px;height:28px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px}
.signout-btn{margin-left:8px;border:1px solid var(--line);background:#fff;color:var(--ink-2);font-family:inherit;font-size:12px;font-weight:600;padding:5px 11px;border-radius:16px;cursor:pointer}
.signout-btn:hover{border-color:var(--teal);color:var(--teal)}
nav.tabs{background:#fff;border-bottom:1px solid var(--line);padding:0 22px;display:flex;gap:4px;position:sticky;top:55px;z-index:40}
nav.tabs a{font-size:16px;text-decoration:none;font-family:inherit;font-weight:600;color:var(--ink-2);padding:13px 14px;border-bottom:2px solid transparent;margin-bottom:-1px}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a.on{color:var(--teal);border-bottom-color:var(--teal)}
.wrap{max-width:720px;margin:0 auto;padding:26px 18px 80px}
.purpose{font-size:15px;color:var(--ink-2);background:#fff;border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:8px;padding:10px 14px;margin-bottom:16px}
.purpose b{color:var(--ink)}
.protostrip{background:#1a2230;color:#fff;text-align:center;font-size:11px;padding:7px}
.protostrip b{color:var(--yellow);font-weight:700;letter-spacing:.04em}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:26px 0 8px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--teal-dark);color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.18);transition:transform .25s;z-index:90}
.toast.show{transform:translateX(-50%) translateY(0)}
.row{border-bottom:1px solid var(--line-soft)}
.row-head{display:flex;align-items:center;gap:12px;padding:14px 4px;cursor:pointer}
.row-head:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px}
.row-title{flex:1;font-size:17px}
.row-meta{font-size:13px;color:var(--ink-3)}
.chev{font-size:13px;color:var(--ink-3);transition:transform .15s;width:14px;text-align:center}
.row.open .chev{transform:rotate(90deg)}
.row-body{display:none}
.row.open .row-body{display:block}
.tbl-empty{padding:30px;text-align:center;color:var(--ink-3);font-size:13px}
.search{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:18px;box-shadow:var(--shadow)}
.search:focus-within{border-color:var(--teal)}
.search .s-ico{font-size:17px;color:var(--ink-3)}
.search input{flex:1;border:none;outline:none;font-family:inherit;font-size:15px;color:var(--ink);background:none}
.docline{display:flex;align-items:center;gap:11px;padding:11px 4px 11px 35px;border-bottom:1px solid var(--line-soft);cursor:pointer}
.docline:hover{background:var(--bg)}
.docline .d-ico{font-size:16px;opacity:.7}
.docline .d-name{flex:1;font-size:16px}
.row-head .d-ico{font-size:16px}
.abtn{font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;padding:8px 17px;border-radius:8px;background:#fff;border:1px solid var(--line);color:var(--ink-2)}
.abtn.av{color:var(--teal);border-color:rgba(0,130,114,.4)}
.abtn.av:hover{background:rgba(0,130,114,.06);border-color:var(--teal)}
.abtn.dl:hover,.abtn.pr:hover{border-color:var(--ink-2);color:var(--ink)}
</style>
</head>

<script>
const sb = supabase.createClient(window.HASC_CONFIG.SUPABASE_URL, window.HASC_CONFIG.SUPABASE_ANON_KEY);
sb.auth.getSession().then(({data})=>{ if(!(data && data.session && data.session.user)) window.location.href='wb-index.html'; });
document.getElementById('signoutBtn').addEventListener('click', async ()=>{ try{ await sb.auth.signOut(); }catch(e){} window.location.href='wb-index.html'; });

let tt;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),1800); }
function tog(head){ head.parentElement.classList.toggle('open'); }
function kd(e,head){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); tog(head); } }
function rmDocHtml(fname){
  var d = (window.__docReg||{})[fname];
  var rec = d && d.rec ? d.rec : null;
  var css = '<style>body{font-family:Segoe UI,Arial,sans-serif;color:#323130;margin:0;padding:32px;}h1{color:#1a8c94;font-size:22px;margin:0 0 4px;}.sub{color:#605e5c;font-size:13px;margin-bottom:18px;}.meta{display:flex;gap:24px;flex-wrap:wrap;background:#f8f9fb;border:1px solid #e1e1e1;border-radius:8px;padding:14px 18px;margin-bottom:20px;font-size:13px;}.meta b{display:block;color:#a19f9d;font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px;}.sec{font-size:11px;font-weight:700;color:#a19f9d;letter-spacing:.08em;text-transform:uppercase;margin:18px 0 8px;}.item{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid #f3f2f1;border-radius:8px;margin-bottom:6px;font-size:14px;}.bx{width:18px;height:18px;border-radius:5px;border:2px solid #c8c8c8;flex-shrink:0;text-align:center;line-height:16px;font-size:12px;}.done .bx{background:#3fc1c9;border-color:#3fc1c9;color:#fff;}.skip{color:#a19f9d;}.sig{margin-top:28px;border-top:1px solid #e1e1e1;padding-top:18px;}.signame{font-family:Segoe Script,cursive;font-size:26px;color:#1a8c94;}.cert{font-style:italic;color:#605e5c;font-size:12px;background:#f8f9fb;border-left:3px solid #3fc1c9;padding:10px 14px;border-radius:6px;margin:12px 0;}</style>';
  if(!rec || !rec.tasks_json){
    return css+'<h1>'+fname+'</h1><p class="sub">Signed compliance checklist.</p><p style="color:#605e5c">No itemized task data was recorded for this submission.</p>';
  }
  var tj = rec.tasks_json;
  var items = (tj && tj.items) ? tj.items : [];
  var doneN = items.filter(function(x){return x.done;}).length;
  var rows = items.map(function(x){
    return '<div class="item '+(x.done?'done':'skip')+'"><span class="bx">'+(x.done?'\u2713':'')+'</span><span>'+x.name+(x.done?'':' \u2014 not done')+'</span></div>';
  }).join('');
  var freq = (tj.frequency||rec.frequency||'').replace(/^./,function(c){return c.toUpperCase();});
  var html = css;
  html += '<h1>'+(rec.home_name||'')+'</h1>';
  html += '<div class="sub">Signed '+freq+' Compliance Checklist</div>';
  html += '<div class="meta"><div><b>Date</b>'+(rec.submitted_at?new Date(rec.submitted_at).toLocaleString():'')+'</div><div><b>Residence</b>'+(rec.home_name||'')+'</div><div><b>Completed</b>'+doneN+' of '+items.length+' items</div></div>';
  html += '<div class="sec">Checklist Items</div>'+rows;
  if(rec.comments){ html += '<div class="sec">Comments</div><div class="item">'+rec.comments+'</div>'; }
  html += '<div class="cert">I certify that I have personally reviewed the information above and affirm that I have checked all items applicable to my residence. I understand that signing this document serves as my legal confirmation for compliance purposes.</div>';
  html += '<div class="sig"><b style="color:#a19f9d;font-size:11px;text-transform:uppercase;letter-spacing:.06em;">Signed by</b><div class="signame">'+(rec.signature||rec.submitted_by||'')+'</div></div>';
  return html;
}
function viewDoc(fname){
  var w = window.open('','_blank');
  if(w){ w.document.write('<title>'+fname+'</title>'+rmDocHtml(fname)); w.document.close(); }
}
function rmPrintDoc(fname){
  var w = window.open('','_blank');
  if(w){ w.document.write('<title>'+fname+'</title>'+rmDocHtml(fname)); w.document.close(); w.focus(); setTimeout(function(){ try{w.print();}catch(e){} }, 400); }
}
function rmDownloadDoc(fname){
  try{
    var blob = new Blob(['<!DOCTYPE html><html><head><meta charset="utf-8"><title>'+fname+'</title></head><body>'+rmDocHtml(fname)+'</body></html>'], {type:'text/html'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = fname.replace(/[^a-z0-9]+/gi,'_')+'.html';
    document.body.appendChild(a); a.click(); a.remove();
    toast('Downloaded '+fname);
  }catch(e){ toast('Download failed'); }
}

let docs=[];
async function loadDocs(){
  try{
    const dres=await sb.from('cl_documents').select('*').order('date',{ascending:false});
    const filed=(dres.error||!dres.data)?[]:dres.data.map(r=>({home:r.home_name,type:r.doc_type,name:r.name,date:r.date,url:r.url,version:r.version,current:true,ok:true}));
    const sres=await sb.from('cl_submissions').select('*').order('submitted_at',{ascending:false});
    const subs=(sres.error||!sres.data)?[]:sres.data.map(r=>{ const dt=(r.submitted_at||'').slice(0,10); const freq=(r.frequency||'Checklist'); const fl=freq.charAt(0).toUpperCase()+freq.slice(1); return {home:r.home_name,type:'Signed Checklist',name:fl+' Checklist - '+dt+' ('+(r.tasks_done||0)+'/'+(r.tasks_total||0)+') - '+(r.submitted_by||'RM'),date:dt,url:'',version:'',current:true,ok:true,rec:r}; });
    docs=subs.concat(filed);
  }catch(e){ console.error('loadDocs failed',e); docs=[]; }
  renderHomes();
}

function renderHomes(){
  const q=(document.getElementById('doc-search').value||'').toLowerCase().trim();
  const wrap=document.getElementById('lib-homes'); wrap.innerHTML='';
  const current=docs.filter(d=>d.current && d.ok);
  const byHome={}; current.forEach(d=>{ (byHome[d.home]=byHome[d.home]||[]).push(d); });
  let homes=Object.keys(byHome).filter(home=>{ if(!q) return true; if(home.toLowerCase().includes(q)) return true; return byHome[home].some(d=>d.type.toLowerCase().includes(q)); }).sort();
  if(homes.length===0){ document.getElementById('lib-empty').style.display='block'; return; }
  document.getElementById('lib-empty').style.display='none';
  homes.forEach(home=>{
    const list=byHome[home].slice().sort((a,b)=>a.type.localeCompare(b.type));
    const lines=list.map(d=>{
      const fname=d.home+' – '+d.type+' – '+d.date;
      window.__docReg=window.__docReg||{}; window.__docReg[fname]=d; return '<div class="docline" onclick="viewDoc(\''+fname+'\')"><span class="d-ico">📄</span><span class="d-name">'+fname+'</span><button class="abtn av" onclick="event.stopPropagation();viewDoc(\''+fname+'\')">View</button><button class="abtn dl" onclick="event.stopPropagation();rmDownloadDoc(\''+fname+'\')">Download</button><button class="abtn pr" onclick="event.stopPropagation();rmPrintDoc(\''+fname+'\')">Print</button></div>';
    }).join('');
    wrap.insertAdjacentHTML('beforeend','<div class="row'+(q?' open':'')+'"><div class="row-head" tabindex="0" role="button" onclick="tog(this)" onkeydown="kd(event,this)"><span class="d-ico" style="opacity:.6">📁</span><span class="row-title">'+home+'</span><span class="row-meta">'+list.length+' files</span><span class="chev">▶</span></div><div class="row-body" style="padding:0 0 8px 0">'+lines+'</div></div>');
  });
}
loadDocs();
</script>
</body>
</html>
