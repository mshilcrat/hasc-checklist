<!DOCTYPE html>
  <html lang="en">
  <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HASC Checklist - Sign Up</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f0f2f5; font-family: 'Segoe UI', system-ui, sans-serif; color: #323130; }
.card { background: #fff; width: 100%; max-width: 400px; padding: 40px 36px; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
.logo { display: block; margin: 0 auto 20px; max-height: 56px; }
h1 { font-size: 22px; text-align: center; margin: 0 0 6px; }
.sub { text-align: center; color: #605e5c; font-size: 14px; margin: 0 0 24px; }
label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
input { width: 100%; padding: 11px 12px; border: 1px solid #e1e1e1; border-radius: 8px; font-size: 14px; outline: none; }
input:focus { border-color: #3fc1c9; }
button { width: 100%; margin-top: 22px; padding: 12px; border: 0; border-radius: 8px; background: #3fc1c9; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
button:hover { background: #1a8c94; }
button:disabled { opacity: .6; cursor: default; }
.foot { text-align: center; font-size: 13px; color: #605e5c; margin-top: 18px; }
.foot a { color: #1a8c94; font-weight: 600; text-decoration: none; }
.msg { text-align: center; font-size: 13px; margin-top: 14px; min-height: 18px; }
.msg.error { color: #d13438; }
  .msg.ok { color: #1a8c94; }
  </style>
</head>
<body>
<div class="card">
<img src="hasc-logo.png" alt="HASC Center" class="logo" />
<h1>Create your account</h1>
<p class="sub">Sign up to access the checklist portal.</p>
<form id="signup-form">
<label for="name">Full name</label>
<input id="name" type="text" placeholder="Jane Smith" required />
<label for="email">Email</label>
<input id="email" type="email" placeholder="you@example.com" required />
  <label for="password">Password</label>
<input id="password" type="password" placeholder="At least 6 characters" minlength="6" required />
  <button type="submit" id="submit-btn">Create account</button>
</form>
<div class="msg" id="msg"></div>
  <p class="foot">Already have an account? <a href="wb-login.html">Sign in</a></p>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="wb-config.js"></script>
<script>
  const client = (typeof supabaseClient !== 'undefined' && supabaseClient) || (window.SUPABASE_URL && window.SUPABASE_ANON_KEY ? window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY) : null);
const form = document.getElementById('signup-form');
const btn = document.getElementById('submit-btn');
const msg = document.getElementById('msg');
form.addEventListener('submit', async (e) => {
  e.preventDefault();
msg.className = 'msg';
msg.textContent = '';
if (!client) { msg.className = 'msg error'; msg.textContent = 'Config error: Supabase client not found in wb-config.js.'; return; }
const full_name = document.getElementById('name').value.trim();
const email = document.getElementById('email').value.trim();
const password = document.getElementById('password').value;
btn.disabled = true;
btn.textContent = 'Creating account...';
const { data, error } = await client.auth.signUp({ email, password, options: { data: { full_name } } });
if (error) { msg.className = 'msg error'; msg.textContent = error.message; btn.disabled = false; btn.textContent = 'Create account'; return; }
  msg.className = 'msg ok';
msg.textContent = 'Account created! Redirecting...';
  setTimeout(() => { window.location.href = 'wb-login.html'; }, 1200);
});
</script>
  </body>
</html>
