<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HASC RM Compliance — Sign in</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="wb-config.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;background:#f6f7f5;color:#26302e;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lg-card{background:#fff;border-radius:18px;border-top:4px solid #3FC1C9;box-shadow:0 18px 50px rgba(0,0,0,.15);padding:32px 28px;width:100%;max-width:380px;text-align:center}
.lg-logo{height:44px;margin:0 auto 10px;display:block}
.lg-title{font-size:20px;font-weight:700;margin-bottom:3px}
.lg-sub{font-size:14px;color:#5d6b67;margin-bottom:22px}
.lg-field{text-align:left;margin-bottom:14px}
.lg-field label{font-size:12px;font-weight:600;color:#5d6b67;display:block;margin-bottom:5px}
.lg-field input{width:100%;padding:12px 14px;border:1px solid #e7eae8;border-radius:10px;font-family:inherit;font-size:15px}
.lg-field input:focus{outline:none;border-color:#3FC1C9;box-shadow:0 0 0 3px rgba(63,193,201,.15)}
.lg-btn{width:100%;padding:13px;border:none;border-radius:10px;background:#3FC1C9;color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.lg-btn:hover{background:#2aa7af}
.lg-btn:disabled{opacity:.6;cursor:not-allowed}
.lg-msg{margin-top:14px;font-size:13px;min-height:18px}
.lg-msg.err{color:#E24B4A}
.lg-msg.ok{color:#1D9E75}
</style>
</head>
<body>
<div class="lg-card">
<img class="lg-logo" src="hasc-logo.png" alt="HASC Center">
<div class="lg-title">RM Compliance</div>
<div class="lg-sub">Sign in to continue</div>
<div class="lg-field"><label for="email">Email</label><input type="email" id="email" autocomplete="username" placeholder="you@hasccenter.org"></div>
<div class="lg-field"><label for="password">Password</label><input type="password" id="password" autocomplete="current-password" placeholder="••••••••"></div>
<button class="lg-btn" id="loginBtn">Sign in</button>
<div class="lg-msg" id="loginErr"></div>
</div>
<script>
const sb = supabase.createClient(window.HASC_CONFIG.SUPABASE_URL, window.HASC_CONFIG.SUPABASE_ANON_KEY);
const loginErr = document.getElementById('loginErr');
function goApp(){ window.location.href = 'wb-today.html'; }
async function checkSession(){
  const { data } = await sb.auth.getSession();
  if(data && data.session && data.session.user){ goApp(); }
}
document.getElementById('loginBtn').addEventListener('click', async () => {
  loginErr.textContent=''; loginErr.className='lg-msg';
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  if(!email || !password){ loginErr.textContent='Enter your email and password.'; loginErr.className='lg-msg err'; return; }
  const btn=document.getElementById('loginBtn'); btn.disabled=true; loginErr.textContent='Signing in…';
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  btn.disabled=false;
  if(error){ loginErr.textContent=error.message||'Sign-in failed.'; loginErr.className='lg-msg err'; return; }
  if(data && data.user){ goApp(); }
});
document.getElementById('password').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('loginBtn').click(); });
checkSession();
</script>
</body>
</html>
