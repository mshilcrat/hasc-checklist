<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HASC RM Compliance — Insights</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="wb-config.js"></script>
<script src="wb-guard.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;background:#f6f7f5;color:#26302e;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
:root{--teal:#008272;--teal-dark:#006458;--yellow:#F5C518;--green:#1D9E75;--red:#E24B4A;--amber:#BA7517;--bg:#f6f7f5;--card:#fff;--ink:#26302e;--ink-2:#5d6b67;--ink-3:#9aa4a0;--line:#e7eae8;--line-soft:#f0f2f0;--shadow:0 1px 3px rgba(0,0,0,.05),0 1px 2px rgba(0,0,0,.04)}
header{background:#fff;border-bottom:3px solid var(--yellow);padding:12px 22px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.brand{display:flex;align-items:center;gap:12px}
.brand img{height:34px;display:block}
.who{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--ink-2)}
.who .av{width:28px;height:28px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px}
.signout-btn{margin-left:8px;border:1px solid var(--line);background:#fff;color:var(--ink-2);font-family:inherit;font-size:12px;font-weight:600;padding:5px 11px;border-radius:16px;cursor:pointer}
.signout-btn:hover{border-color:var(--teal);color:var(--teal)}
nav.tabs{background:#fff;border-bottom:1px solid var(--line);padding:0 22px;display:flex;gap:4px;position:sticky;top:55px;z-index:40}
nav.tabs a{font-size:16px;text-decoration:none;font-family:inherit;font-weight:600;color:var(--ink-2);padding:13px 14px;border-bottom:2px solid transparent;margin-bottom:-1px}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a.on{color:var(--teal);border-bottom-color:var(--teal)}
.wrap{max-width:720px;margin:0 auto;padding:26px 18px 80px}
.purpose{font-size:15px;color:var(--ink-2);background:#fff;border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:8px;padding:10px 14px;margin-bottom:16px}
.purpose b{color:var(--ink)}
.lb-card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden;box-shadow:var(--shadow)}
.coordrow{display:flex;align-items:center;padding:16px 18px;cursor:pointer}
.coordrow.attn{background:rgba(226,75,74,.05)}
.coord-rank{font-size:22px;font-weight:800;color:var(--ink-3);width:44px;flex-shrink:0}
.coord-main{flex:1}
.coord-name{font-weight:700;font-size:16px;color:var(--ink)}
.coord-flag{color:var(--red);font-weight:700;font-size:12px;margin-left:6px}
.coord-sub{font-size:12px;color:var(--ink-2);margin-top:2px}
.coord-pct{font-size:20px;font-weight:800;margin-right:12px}
.arrow{color:var(--ink-3)}
.homes{display:none}.homes.open{display:block}
.homerow{display:flex;align-items:center;padding:11px 18px 11px 40px;border-top:1px solid var(--line-soft);cursor:pointer}
.dot{width:9px;height:9px;border-radius:50%;margin-right:11px;flex-shrink:0}
.home-name{flex:1;font-size:14px;color:var(--ink)}
.home-rm{font-size:12px;color:var(--ink-3);margin-right:12px}
.home-pct{font-size:13px;font-weight:700;width:40px;text-align:right}
.cats{display:none;background:var(--bg)}.cats.open{display:block}
.catrow{display:flex;justify-content:space-between;align-items:center;padding:8px 18px 8px 64px;border-top:1px solid var(--line-soft)}
.cat-name{font-size:13px;color:var(--ink-2);text-transform:capitalize}
.pill{font-size:11px;font-weight:600;padding:2px 9px;border-radius:10px}
.pill.up{color:var(--green);background:rgba(29,158,117,.12)}
.pill.behind{color:var(--amber);background:rgba(186,117,23,.12)}
.pill.none{color:var(--red);background:rgba(226,75,74,.12)}
.loading{text-align:center;color:var(--ink-3);padding:40px;font-size:14px}
</style>
</head>
<body>
<header>
<div class="brand"><img src="hasc-logo.png" alt="HASC Center"></div>
<div class="who"><span class="av" id="avatar">MS</span><span id="whoName">&nbsp;</span><button class="signout-btn" id="signoutBtn">Sign out</button></div>
</header>
<nav class="tabs">
<a href='/wb-today'>Today</a>
<a class='on' href='/wb-insights'>Insights</a>
<a href='/wb-documents'>Documents</a>
<a href='/wb-library'>Library</a>
<a href='/wb-checklists'>Checklists</a>
</nav>
<div class="wrap">
<div class="purpose"><b>Compliance overview</b> &mdash; ranked worst-first. Click a coordinator to expand their residences, then a residence for its checklists.</div>
<div id="board"><div class="loading">Loading compliance data&hellip;</div></div>
</div>
<script>
(function(){
  var sb = window.__hascClient || (window.supabase && window.WB_CONFIG && window.supabase.createClient(window.WB_CONFIG.url, window.WB_CONFIG.anonKey));
  if(!window.__hascClient && sb) window.__hascClient = sb;

  function nameFromEmail(e){ if(!e) return ''; var u=e.split('@')[0]; return u; }
  function pctColor(p){ return p>=75 ? 'var(--green)' : (p>=25 ? 'var(--amber)' : 'var(--red)'); }
  function dotColor(p){ return p>=75 ? 'var(--green)' : (p>=25 ? 'var(--yellow)' : 'var(--red)'); }
  function fmtDate(iso){ if(!iso) return ''; var d=new Date(iso); return (d.getMonth()+1)+'/'+d.getDate()+'/'+d.getFullYear(); }

  async function load(){
    var role = sessionStorage.getItem('hasc_role') || 'admin';
    var myEmail = (await sb.auth.getSession()).data.session.user.email;

    var homes = (await sb.from('cl_homes').select('home_name, rm_email, ac_email')).data || [];
    var subs  = (await sb.from('cl_submissions').select('home_name, submitted_by, submitted_at, tasks_done, tasks_total, frequency')).data || [];

    // ROLE FILTER: admins see all; a coordinator sees only their own residences
    if(role !== 'admin'){ homes = homes.filter(function(h){ return h.ac_email === myEmail; }); }

    // latest submission per home+frequency
    var latest = {};
    subs.forEach(function(s){
      latest[s.home_name] = latest[s.home_name] || {};
      var cur = latest[s.home_name][s.frequency];
      if(!cur || new Date(s.submitted_at) > new Date(cur.submitted_at)) latest[s.home_name][s.frequency] = s;
    });

    // per-home overall completion = avg of its latest submissions' done/total
    function homePct(hn){
      var f = latest[hn]; if(!f) return 0;
      var d=0,t=0; Object.keys(f).forEach(function(k){ d+=f[k].tasks_done; t+=f[k].tasks_total; });
      return t ? Math.round(d/t*100) : 0;
    }

    // group by coordinator
    var coords = {};
    homes.forEach(function(h){
      var key = h.ac_email;
      coords[key] = coords[key] || { email:key, name:nameFromEmail(key), homes:[] };
      coords[key].homes.push(h);
    });
    var list = Object.keys(coords).map(function(k){
      var c = coords[k];
      var sum=0; c.homes.forEach(function(h){ sum += homePct(h.home_name); });
      c.avg = c.homes.length ? Math.round(sum/c.homes.length) : 0;
      c.behind = c.homes.filter(function(h){ return homePct(h.home_name) < 75; }).length;
      return c;
    }).sort(function(a,b){ return a.avg - b.avg; });

    var freqs = ['daily','weekly','weekend'];
    var html = '';
    list.forEach(function(c, i){
      var attn = i===0 ? ' attn' : '';
      var flag = i===0 ? ' <span class="coord-flag">&#9888; NEEDS ATTENTION</span>' : '';
      var homeRows = '';
      c.homes.slice().sort(function(a,b){ return homePct(a.home_name)-homePct(b.home_name); }).forEach(function(h){
        var p = homePct(h.home_name);
        var catRows = '';
        freqs.forEach(function(f){
          var s = latest[h.home_name] && latest[h.home_name][f];
          var cls, txt;
          if(!s){ cls='none'; txt='Not started'; }
          else {
            var fp = s.tasks_total ? Math.round(s.tasks_done/s.tasks_total*100) : 0;
            if(fp>=75){ cls='up'; txt='Up to date'; }
            else { cls='behind'; txt='Behind &middot; last done '+fmtDate(s.submitted_at); }
          }
          catRows += '<div class="catrow"><span class="cat-name">'+f+'</span><span class="pill '+cls+'">'+txt+'</span></div>';
        });
        homeRows += '<div class="home-block">'
          + '<div class="homerow" onclick="__toggleHome(this)">'
          + '<span class="dot" style="background:'+dotColor(p)+'"></span>'
          + '<span class="home-name">'+h.home_name+'</span>'
          + '<span class="home-rm">'+nameFromEmail(h.rm_email)+'</span>'
          + '<span class="home-pct" style="color:'+pctColor(p)+'">'+p+'%</span>'
          + '<span class="arrow" style="margin-left:10px">&#9656;</span></div>'
          + '<div class="cats">'+catRows+'</div></div>';
      });
      html += '<div class="lb-card">'
        + '<div class="coordrow'+attn+'" onclick="__toggleCoord(this)">'
        + '<span class="coord-rank">#'+(i+1)+'</span>'
        + '<div class="coord-main"><div class="coord-name">'+c.name+flag+'</div>'
        + '<div class="coord-sub">'+c.behind+' of '+c.homes.length+' residences behind</div></div>'
        + '<span class="coord-pct" style="color:'+pctColor(c.avg)+'">'+c.avg+'%</span>'
        + '<span class="arrow">&#9656;</span></div>'
        + '<div class="homes">'+homeRows+'</div></div>';
    });

    document.getElementById('board').innerHTML = html || '<div class="loading">No residences assigned to you.</div>';

    // header identity
    var av = (myEmail||'').slice(0,2).toUpperCase();
    document.getElementById('avatar').textContent = av;
    document.getElementById('whoName').textContent = nameFromEmail(myEmail);
  }

  window.__toggleCoord = function(el){
    var homes = el.parentElement.querySelector('.homes');
    var open = homes.classList.toggle('open');
    el.querySelector('.arrow').innerHTML = open ? '&#9662;' : '&#9656;';
  };
  window.__toggleHome = function(el){
    var cats = el.nextElementSibling;
    var open = cats.classList.toggle('open');
    el.querySelector('.arrow').innerHTML = open ? '&#9662;' : '&#9656;';
  };

  var so = document.getElementById('signoutBtn');
  if(so) so.addEventListener('click', async function(){ try{ await sb.auth.signOut(); }catch(e){} sessionStorage.clear(); location.href='/wb-login'; });

  if(document.readyState !== 'loading') load(); else document.addEventListener('DOMContentLoaded', load);
})();
</script>
</body>
</html>
