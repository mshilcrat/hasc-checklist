<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HASC RM Compliance</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="wb-config.js"></script>
<script src="wb-guard.js"></script>
  <script>
    if(window.supabase && window.HASC_CONFIG && !window.__hascClient){
      window.__hascClient = window.supabase.createClient(window.HASC_CONFIG.SUPABASE_URL, window.HASC_CONFIG.SUPABASE_ANON_KEY);
    }
  </script>
  
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#eef2f5; color:#223038;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .topbar { background:#fff; border-bottom:3px solid #17a2b8;
    display:flex; align-items:center; gap:16px; padding:12px 24px; flex-wrap:wrap; }
  .logo { display:flex; align-items:center; gap:9px; font-weight:800; color:#17a2b8; letter-spacing:.5px; }
  .page-label { color:#8a97a1; font-size:15px; padding-left:14px; border-left:1px solid #e2e8ec; }
  .whoami { margin-left:auto; display:flex; align-items:center; gap:10px; }
  .badge { width:36px; height:36px; border-radius:50%; background:#1a9d5a; color:#fff;
    font-weight:700; font-size:14px; display:flex; align-items:center; justify-content:center; }
  .user-name { font-size:14px; color:#445561; }
  .container { max-width:1080px; margin:0 auto; padding:26px 24px 60px; }
  .screen-title { font-size:25px; font-weight:700; margin:0 0 4px; }
  .screen-sub { font-size:15px; color:#6a7b86; margin:0 0 24px; }
  .cubes { display:grid; grid-template-columns:repeat(4,235px); gap:22px; justify-content:start; align-items:stretch; }
  .cube { background:#fff; border:1px solid #edf1f4; border-radius:10px;
    box-shadow:0 1px 3px rgba(34,48,56,.06); padding:22px 20px 26px; cursor:pointer; text-decoration:none; color:inherit; display:block;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease; }
  .cube:hover { transform:translateY(-2px); box-shadow:0 8px 18px rgba(34,48,56,.12); border-color:#dfe7ec; }
  .cube-icon { font-size:26px; line-height:1; display:block; margin-bottom:22px; }
  .cube-title { font-weight:700; font-size:15.5px; margin:0 0 8px; color:#1f2d36; }
  .cube-desc { font-size:13.5px; color:#7a8894; line-height:1.55; }
  @media (max-width:1080px){ .cubes { grid-template-columns:repeat(3,235px); } }
  @media (max-width:820px){ .cubes { grid-template-columns:repeat(2,235px); } }
  @media (max-width:560px){ .cubes { grid-template-columns:1fr; } .page-label { display:none; } }

  .m2badge{display:inline-block;background:#0aa6b7;color:#fff;font-size:11px;font-weight:800;letter-spacing:1px;padding:3px 8px;border-radius:6px;vertical-align:middle;margin-left:6px}
</style>
</head>
<body>
  <header class="topbar">
    <div class="logo">HASC CENTER</div> <span class="m2badge">MARK 2</span>
    <div class="page-label">RM Compliance</div>
    <div class="whoami"><div class="badge" id="badge">--</div><div class="user-name" id="userName">Loading...</div></div>
  </header>
  <main class="container">
    <h1 class="screen-title" id="welcome">Welcome back</h1>
    <p class="screen-sub">Choose where you want to go.</p>
    <div class="cubes" id="cubes"></div>
  </main>
<script>
  // Hub = launcher. Each tile links to a standalone spoke module.
  // To add a new module: add one entry here + create its file. Nothing else changes.
  var MODULES = [
    { id:"today",      href:"wb-today-mark2.html",      icon:"\uD83D\uDCC5", title:"Today",      desc:"Which homes signed off today and which are still pending." },
    { id:"insights",   href:"wb-insights-mark2.html",   icon:"\uD83D\uDCCA", title:"Insights",   desc:"Compliance trends by home and by cycle." },
    { id:"documents",  href:"wb-documents-mark2.html",  icon:"\uD83D\uDCC4", title:"Documents",  desc:"Grab or print the latest signed checklist for any home." },
    { id:"checklists", href:"wb-checklists-mark2.html", icon:"\uD83D\uDCCB", title:"Checklists", desc:"Open and manage the checklists behind every residence." },
    { id:"inbox",      href:"wb-inbox-mark2.html",      icon:"\uD83D\uDCE5", title:"Inbox",      desc:"Newly signed documents land here — mark each Handled once filed." }
  ];
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  var wrap = document.getElementById("cubes");
  wrap.innerHTML = MODULES.map(function(m){
    return '<a class="cube" href="'+m.href+'">'
      + '<span class="cube-icon">'+m.icon+'</span>'
      + '<div class="cube-title">'+esc(m.title)+'</div>'
      + '<div class="cube-desc">'+esc(m.desc)+'</div></a>';
  }).join("");

  (async function(){
    try{
      var client = window.__hascClient;
      if(!client) return;
      var u = await client.auth.getUser();
      var email = u && u.data && u.data.user ? u.data.user.email : null;
      if(!email) return;
      var r = await client.from("profiles").select("full_name").eq("email", email).maybeSingle();
      var name = r && r.data && r.data.full_name ? r.data.full_name : email;
      document.getElementById("welcome").textContent = "Welcome back, " + name.split(" ")[0];
      document.getElementById("userName").textContent = name;
      document.getElementById("badge").textContent = name.split(" ").map(function(p){return p[0];}).join("").slice(0,2).toUpperCase();
    }catch(e){ console.warn("[HASC hub] user load:", e); }
  })();
</script>
</body>
</html>
